<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="2048" height="2048" fill="none">
  <defs>
    <linearGradient id="scanGlow" x1="512" y1="180" x2="512" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="512" y1="180" x2="512" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4D4D8"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame - The White Album Architectural Dark -->
  <rect width="1024" height="1024" rx="140" fill="#09090B"/>
  <rect x="44" y="44" width="936" height="936" rx="104" stroke="#27272A" stroke-width="4"/>
  <rect x="64" y="64" width="896" height="896" rx="88" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Vision AI Viewfinder Corner Brackets (Top-Left, Top-Right, Bottom-Left, Bottom-Right) -->
  <path d="M148 228V164H212" stroke="#10B981" stroke-width="10" stroke-linecap="square"/>
  <path d="M876 228V164H812" stroke="#10B981" stroke-width="10" stroke-linecap="square"/>
  <path d="M148 732V796H212" stroke="#10B981" stroke-width="10" stroke-linecap="square"/>
  <path d="M876 732V796H812" stroke="#10B981" stroke-width="10" stroke-linecap="square"/>

  <!-- Subtle Technical Grid Lines -->
  <line x1="148" y1="480" x2="876" y2="480" stroke="#10B981" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="10 10"/>
  <line x1="512" y1="164" x2="512" y2="796" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Center AI Vision Vertical Scan Field -->
  <rect x="444" y="190" width="136" height="550" fill="url(#scanGlow)"/>

  <!-- LEFT WING: Candi Bentar (Balinese Split Gate) with Architectural Terraces -->
  <g fill="url(#gateGrad)">
    <!-- Base Pedestal -->
    <rect x="196" y="700" width="248" height="40"/>
    <rect x="216" y="668" width="228" height="24"/>
    <!-- Main Stepped Body -->
    <path d="M236 660V560H268V470H300V385H332V305H364V235H396V190H444V660H236Z"/>
    <!-- Balinese Carvings / Architectural Relief Notches (Left Outer Edge Accents) -->
    <rect x="220" y="544" width="28" height="16"/>
    <rect x="252" y="454" width="28" height="16"/>
    <rect x="284" y="369" width="28" height="16"/>
    <rect x="316" y="289" width="28" height="16"/>
    <rect x="348" y="219" width="28" height="16"/>
    <rect x="384" y="174" width="24" height="16"/>
  </g>
  <!-- Inner Sacred Line Detail on Left Wing -->
  <path d="M420 220V660" stroke="#09090B" stroke-width="8"/>
  <path d="M396 270V660" stroke="#09090B" stroke-width="5" stroke-opacity="0.6"/>

  <!-- RIGHT WING: Candi Bentar (Balinese Split Gate) with Architectural Terraces -->
  <g fill="url(#gateGrad)">
    <!-- Base Pedestal -->
    <rect x="580" y="700" width="248" height="40"/>
    <rect x="580" y="668" width="228" height="24"/>
    <!-- Main Stepped Body -->
    <path d="M788 660V560H756V470H724V385H692V305H660V235H628V190H580V660H788Z"/>
    <!-- Balinese Carvings / Architectural Relief Notches (Right Outer Edge Accents) -->
    <rect x="776" y="544" width="28" height="16"/>
    <rect x="744" y="454" width="28" height="16"/>
    <rect x="712" y="369" width="28" height="16"/>
    <rect x="680" y="289" width="28" height="16"/>
    <rect x="648" y="219" width="28" height="16"/>
    <rect x="616" y="174" width="24" height="16"/>
  </g>
  <!-- Inner Sacred Line Detail on Right Wing -->
  <path d="M604 220V660" stroke="#09090B" stroke-width="8"/>
  <path d="M628 270V660" stroke="#09090B" stroke-width="5" stroke-opacity="0.6"/>

  <!-- Center Vision AI Laser Scan Bar & Node -->
  <line x1="410" y1="436" x2="614" y2="436" stroke="#10B981" stroke-width="8"/>
  <circle cx="512" cy="436" r="16" fill="#09090B" stroke="#10B981" stroke-width="8"/>
  <circle cx="512" cy="436" r="5" fill="#10B981"/>

  <!-- Typography inside Emblem -->
  <text x="512" y="874" text-anchor="middle" fill="#FFFFFF" font-family="Noto Serif Display, DejaVu Serif, serif" font-size="68" font-weight="700" letter-spacing="2">WastraJaga</text>
  <text x="512" y="922" text-anchor="middle" fill="#10B981" font-family="IBM Plex Mono, JetBrains Mono, monospace" font-size="22" font-weight="600" letter-spacing="8">VISION AI • BALI</text>
</svg>
